[project]
name = "rag-app-backend"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
# Starlette's TestClient warns that it will move from httpx to httpx2.
filterwarnings = ["ignore:Using `httpx`"]

[tool.ruff]
line-length = 100
